[project]
name = "noise-injection-sandbagging"
version = "0.1.0"
description = "Reproduction of noise-injection effects on sandbagging language models (arXiv 2412.01784)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch",
    # Imported directly by core_claim.py and eval_model_on_dataset_batches.py.
    # Previously arrived only transitively via transformer-lens, which is no longer
    # a dependency -- the project moved off TransformerLens to Hugging Face for
    # batched generation.
    "transformers",
    # Required by transformers for the `device_map=` argument used in core_claim.py.
    # Also previously transitive via transformer-lens.
    "accelerate",
    "datasets",
    "pandas",
    "matplotlib",
    # Not imported; provides `huggingface-cli login`, needed to access the model.
    "huggingface-hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "experiments"]

[project]
name = "noise-injection-sandbagging"
version = "0.1.0"
description = "Reproduction of noise-injection effects on sandbagging language models (arXiv 2412.01784)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "circuitsvis",
    "datasets",
    "huggingface-hub",
    "ipython",
    "jupyter",
    "plotly",
    "transformer-lens",
    "pandas",
    "torch",
    "matplotlib",
    "einops",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "experiments"]
